---
layout: null
---
<?DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} | Westlake University</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root {
    --text: #1a1a1a;
    --muted: #555;
    --accent: #1a5fb4;
    --border: #e2e2e2;
    --bg: #ffffff;
    --link: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e8e8e8;
      --muted: #aaa;
      --accent: #7cb1f0;
      --border: #333;
      --bg: #16161a;
      --link: #7cb1f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    margin: 0;
    line-height: 1.7;
    font-size: 16px;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

  header.site {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 1rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--border);
  }
  .site-name { font-weight: 600; }
  .site-name a { color: var(--text); text-decoration: none; }
  nav a { margin-left: 1.2rem; color: var(--muted); text-decoration: none; font-size: 0.92rem; }
  nav a:hover { color: var(--link); }
  nav a.active { color: var(--text); }

  .hero { display: flex; gap: 2.5rem; align-items: flex-start; flex-wrap: wrap; }
  .hero-text { flex: 1 1 460px; }
  .hero-text h1 { margin: 0 0 0.3rem; font-size: 2rem; }
  .hero-text .title { color: var(--muted); margin-bottom: 1.2rem; }
  .avatar {
    width: 170px; height: 210px; object-fit: cover; object-position: 50% 0%; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card, #f3f3f5);
  }

  section { margin-top: 3rem; }
  h2 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; margin-bottom: 1rem; }

  .pub { margin-bottom: 1.1rem; padding-left: 1.2rem; text-indent: -1.2rem; }
  .pub .me { font-weight: 600; }
  .pub .venue { color: var(--muted); font-style: italic; }
  .pub .links { font-size: 0.85rem; }

  ul.clean { list-style: none; padding-left: 0; }
  ul.clean li { margin-bottom: 0.5rem; }

  /* Blog list */
  .post-item { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.55rem; }
  .post-item a { text-decoration: none; }
  .post-item a:hover { text-decoration: underline; }
  .post-date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 0.92rem; }
  .post-tag { font-size: 0.8rem; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 0.4rem; margin-left: 0.5rem; }

  /* Post page */
  .post-header { margin-bottom: 2rem; }
  .post-header h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
  .post-meta { color: var(--muted); font-size: 0.92rem; }
  .post-content h2 { border-bottom: none; }
  .post-content pre { background: var(--border); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.88rem; }
  .post-content code { font-size: 0.88rem; }
  .post-content img { max-width: 100%; }
  .post-content blockquote { border-left: 3px solid var(--border); margin-left: 0; padding-left: 1rem; color: var(--muted); }

  .lang-toggle { font-size: 0.9rem; margin-bottom: 1.5rem; }
  .lang-toggle a { text-decoration: none; }

  /* Research pillars */
  .pillar {
    display: flex; gap: 2rem; align-items: flex-start;
    margin-bottom: 1.8rem;
  }
  .pillar-text { flex: 1 1 55%; }
  .pillar-text h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
  .pillar-text p { margin: 0; }
  .pillar-figure { flex: 0 1 300px; margin: 0; }
  .pillar-figure figcaption { margin-top: 0.35rem; text-align: center; }
  .figure-placeholder {
    width: 300px; height: 200px;
    border: 1.5px dashed var(--border); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.85rem; text-align: center;
    padding: 0.5rem;
  }
  .figure-placeholder::before { content: attr(data-label); }
  .pillar-figure img { width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); }
  @media (max-width: 640px) {
    .pillar { flex-direction: column; }
    .pillar-figure { flex-basis: auto; }
    .figure-placeholder { width: 100%; }
  }

  /* News */
  .news-list { list-style: none; padding-left: 0; }
  .news-list li { margin-bottom: 0.5rem; padding-left: 1.2rem; text-indent: -1.2rem; }
  .news-date { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 0.4rem; }

  /* Publication groups */
  .pub-group { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin: 1.4rem 0 0.6rem; }
  .pub-group:first-of-type { margin-top: 0; }

  /* CV timeline */
  .cv-entry {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 0 1.2rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
  }
  .cv-entry:last-child { border-bottom: none; }
  .cv-years { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cv-deg { font-weight: 600; }
  .cv-detail { margin-top: 0.15rem; font-size: 0.92rem; color: var(--muted); }
  .cv-advisors { display: flex; gap: 2rem; flex-wrap: wrap; }

  a { color: var(--link); }
  .muted { color: var(--muted); }
  .note { font-size: 0.88rem; color: var(--muted); }
</style>
</head>
<body>
<div class="container">

  <header class="site">
    <div class="site-name"><a href="{{ '/' | relative_url }}">Zhen Cui</a></div>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.home %}class="active"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.blog %}class="active"{% endif %}>Blog</a>
      <a href="{{ '/#publications' | relative_url }}">Publications</a>
      <a href="{{ '/#cv' | relative_url }}">CV</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </header>

{{ content }}

  <footer style="margin-top:4rem" class="note">
    © 2026 Zhen Cui · <a href="https://github.com/IequalsFt">GitHub</a>
  </footer>
</div>
</body>
</html>
